networks:
  mentoring-net:
    name: mentoring-net
    # На VPS сеть уже создана (общая для mentoring-сервисов).
    external: true

services:
  app:
    build: .                        # локально: docker compose build
    # CI пушит этот тег в GHCR; на VPS: docker compose pull app
    image: ghcr.io/savinovsergey/test-api:latest
    container_name: task-api
    ports:
      - "8000:8000"
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DEBUG: ${DEBUG:-false}
      LLM_API_KEY: ${LLM_API_KEY}
      # существующий контейнер qdrant в mentoring-net (не поднимаем свой на VPS)
      QDRANT_URL: http://qdrant:6333
    restart: unless-stopped
    networks:
      - mentoring-net
    depends_on:
      - qdrant

  qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: qdrant
    ports:
      - "6333:6333"
    volumes:
      - ./qdrant_data:/qdrant/storage
    networks:
      - mentoring-net
    restart: unless-stopped
