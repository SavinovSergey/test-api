name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]


jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: pytest tests/ -v
        env:
          # Только секрет. Остальное (base URL, model, top_k, эмбеддер) —
          # дефолты из app/config.py, общие для CI / локали / прода.
          LLM_API_KEY: ${{ secrets.LLM_API_KEY || "dummy-for-mocked-tests"}}
          # QDRANT_URL: http://localhost:6333
          ENABLE_WEB_SEARCH: "false"

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase image
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          name=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=ghcr.io/${owner}/${name}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/mentoring/rag-service
            # Только секреты. Имя модели, base URL, top_k и т.д.
            # — дефолты из app/config.py.
            cat > .env << EOF
            LLM_API_KEY=${{ secrets.LLM_API_KEY }}
            QDRANT_URL=http://qdrant:6333
            EOF
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            # Ждём уже запущенный qdrant (не создаём свой — иначе Conflict по имени).
            for i in $(seq 1 30); do
              if docker exec qdrant true 2>/dev/null; then
                echo "qdrant is up"
                break
              fi
              echo "waiting for qdrant... ($i)"
              sleep 2
            done
            docker exec qdrant true
            docker compose pull app
            docker image prune -f
            docker compose up -d app
